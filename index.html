<script>
// ====== PASTE YOUR FIREBASE WEB CONFIG HERE (Firebase console > Project settings > Your apps) ======
const FIREBASE_CONFIG={apiKey:"AIzaSyBLunfez0vVDKxRwDy3q5JXXC9JHyZl_m8",authDomain:"inkwell-ade0e.firebaseapp.com",projectId:"inkwell-ade0e",appId:"1:167126808618:web:2c30684ce1a232edca2b53"};
// ====================================================================================================
// Adapter: gives the app the same db/user/room/downloads interface it had on claude.ai, backed by Firebase.
(()=>{
const ok=!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId),$a=()=>document.getElementById('app');
let fdb=null,auth=null,authP=null,cache={};
function setup(){$a().innerHTML='<div class="wrap"><h1>Almost there</h1><p class="muted">Add your Firebase config at the top of this file (see README.md), then reload.</p></div>'}
function signedIn(){
  return authP||(authP=new Promise(res=>{
    auth.onAuthStateChanged(u=>{
      if(u)return res(u);
      $a().innerHTML='<div class="wrap"><h1>✒️ Inkwell</h1><p class="muted">Pick the name your co-author will see.</p><div class="row"><input id="gnm" placeholder="Your name" maxlength="40"><button class="pri" id="gsi">Start writing</button></div></div>';
      const gi=document.getElementById('gnm');try{gi.value=localStorage.getItem('ink-name')||''}catch(e){}
      const go=()=>{const n=gi.value.trim();if(!n)return gi.focus();try{localStorage.setItem('ink-name',n)}catch(e){}auth.signInAnonymously().catch(x=>alert(x.message))};
      document.getElementById('gsi').onclick=go;gi.onkeydown=e=>{if(e.key==='Enter')go()};
    });
  }));
}
const userNs={
  me:async()=>{const u=await signedIn();let name='Guest';try{name=localStorage.getItem('ink-name')||'Guest'}catch(e){}await fdb.doc('profiles/'+u.uid).set({name},{merge:true});return{id:u.uid,name}},
  id:async()=>(await signedIn()).uid,
  profiles:async ids=>{const o={};await Promise.all(ids.map(async i=>{try{const s=await fdb.doc('profiles/'+i).get();o[i]={name:s.exists?s.data().name:''}}catch(e){o[i]={name:''}}}));return o}
};
const dl={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return{status:'saved'}}};
async function mkRoom(){
  const u=await signedIn(),col=fdb.collection('presence'),ref=col.doc(u.uid);let cur={},list=[],fns=[];
  const beat=()=>ref.set({...cur,uid:u.uid,at:Date.now()}).catch(()=>{});
  col.onSnapshot(s=>{list=s.docs.map(d=>d.data());fns.forEach(f=>f())},()=>{});
  setInterval(beat,15000);setInterval(()=>fns.forEach(f=>f()),10000);
  window.addEventListener('beforeunload',()=>ref.delete().catch(()=>{}));
  return{presence:async p=>{cur=p;await beat()},peers:()=>list.filter(d=>Date.now()-d.at<40000).map(d=>({isMe:d.uid===u.uid,presence:d})),onPeers:f=>fns.push(f)};
}
async function load(n){
  if(!ok){setup();return new Promise(()=>{})}
  if(!fdb){firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fdb=firebase.firestore()}
  if(n==='db'){await signedIn();return fdb}

  if(n==='room')return mkRoom();
  if(n==='downloads')return dl;
  return null; // 'assets' (file attachments) is off in the GitHub build
}
window.claude={use:n=>cache[n]||(cache[n]=load(n))};
})();

<script>
(async()=>{
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wc=t=>((t||'').match(/\S+/g)||[]).length;
let db=null,user=null,myId=null,myName='Guest',names={},novels=[],chapters=[],novelId=null,chapId=null,pending=null;
let unsubC=null,dirty=false,timer=null,savedAt=0,built=false,armed=false,unsubN2=null,notes=[],tab='ed',drafts=false;
const nm=id=>id===myId?'you':(names[id]||'Someone');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4500)}
function fail(e){toast(e&&e.code==='not_granted'?'You can view this but not edit. Ask the owner to make you a Contributor.':'Something went wrong: '+((e&&e.message)||e))}

app.innerHTML='<p class="wrap muted">Loading…</p>';
const use=window.claude&&claude.use?claude.use.bind(claude):async()=>null;
db=await use('db');user=await use('user');
if(!db){app.innerHTML='<div class="wrap"><h1>Sign in to start writing</h1><p class="muted">Open this page in claude.ai while signed in to co-write.</p></div>';return}
try{const me=await user.me();myId=me.id;myName=me.name||'Guest'}catch(e){}

async function resolve(ids){
  ids=[...new Set(ids.filter(Boolean))].filter(i=>!names[i]);
  if(!ids.length||!user)return;
  try{const p=await user.profiles(ids);for(const i in p)names[i]=p[i].name||'Someone'}catch(e){}
  refresh();
}
function refresh(){novelId?(updNovel(),showStats(),chapId&&(showCm(chapId),showVh(chapId))):updHome()}

function buildHome(){
  app.innerHTML=`<div class="top"><div class="brand">✒️ Inkwell</div><div class="who">${esc(myName)}</div></div>
  <main class="wrap"><h1>Your novels</h1><p class="muted">Start a story, then share this page’s link with your co-author.</p>
  <div class="row"><input id="nt" placeholder="Novel title"><input id="ns" placeholder="One-line premise (optional)"><button class="pri" id="nc">Create novel</button></div>
  <div id="list" class="grid"></div></main>`;
  $('#nc').onclick=()=>{
    const title=$('#nt').value.trim();if(!title)return toast('Give your novel a title first.');
    db.collection('novels').add({title,synopsis:$('#ns').value.trim(),by:myId,createdAt:Date.now()}).then(r=>{location.hash=r.id}).catch(fail);
  };
}
function updHome(){
  const l=$('#list');if(!l)return;
  l.innerHTML=novels.length?novels.map(n=>`<a class="card" href="#${n.id}"><h3>${esc(n.title)}</h3><p class="muted">${esc(n.synopsis)}</p><small>Started by ${esc(nm(n.by))}</small></a>`).join(''):'<p class="muted">No novels yet. Create the first one above.</p>';
}

function buildNovel(){

// Replace text through the browser's own editing commands so Undo/Redo can reverse it.
function edSub(rx,to,pre){
  const cb=$('#cb'),sel=getSelection(),tw=document.createTreeWalker(cb,NodeFilter.SHOW_TEXT),ns=[];let n=0;
  while(tw.nextNode())ns.push(tw.currentNode);
  cb.focus();
  ns.forEach(t=>{
    const ms=[];let m;rx.lastIndex=0;
    while((m=rx.exec(t.nodeValue))){const a=m.index+(pre?m[1].length:0);ms.push([a,m[0].length-(pre?m[1].length:0)]);if(m[0]==='')rx.lastIndex++}
    for(let i=ms.length-1;i>=0&&t.isConnected;i--){
      const r=document.createRange();r.setStart(t,ms[i][0]);r.setEnd(t,ms[i][0]+ms[i][1]);
      sel.removeAllRanges();sel.addRange(r);
      document.execCommand(to===''?'delete':'insertText',false,to);n++;
    }
  });
  return n;
}
function spellFix(from,to){

// ---- Dictionary tab (free dictionaryapi.dev + Datamuse, no key needed) ----
let dcSel='',dcWord='',dcSeq=0;const dcCache=new Map();
const dcHist=()=>{try{const a=JSON.parse(localStorage.getItem('ink-lookups')||'[]');return Array.isArray(a)?a.filter(x=>typeof x==='string').slice(0,12):[]}catch(e){return[]}};
const dcPush=w=>{try{localStorage.setItem('ink-lookups',JSON.stringify([w,...dcHist().filter(x=>x!==w)].slice(0,12)))}catch(e){}};
async function dcGet(url){const r=await fetch(url);if(r.status===404)return null;if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
const dcClean=raw=>String(raw||'').trim().toLowerCase().replace(/’/g,"'").replace(/[^a-z' -]/g,'').replace(/\s+/g,' ').slice(0,40);
async function dcLookup(raw){
  const w=dcClean(raw);if(!w)return null;
  if(dcCache.has(w))return dcCache.get(w);
  const q=encodeURIComponent(w),dm='https://api.datamuse.com/';
  const [def,syn,ant,rhy,sug]=await Promise.all([
    dcGet('https://api.dictionaryapi.dev/api/v2/entries/en/'+q).catch(()=>undefined),
    dcGet(dm+'words?rel_syn='+q+'&max=16').catch(()=>[]),
    dcGet(dm+'words?rel_ant='+q+'&max=12').catch(()=>[]),
    dcGet(dm+'words?rel_rhy='+q+'&max=20').catch(()=>[]),
    dcGet(dm+'sug?s='+q+'&max=6').catch(()=>[])
  ]);
  const ws=a=>(Array.isArray(a)?a:[]).map(x=>x&&x.word).filter(Boolean);
  const r={w,def,syn:ws(syn),ant:ws(ant),rhy:ws(rhy),sug:ws(sug).filter(x=>x!==w)};
  if(def!==undefined)dcCache.set(w,r);
  return r;
}
const dcChips=(l,max)=>l.slice(0,max).map(x=>`<button class="dcw" data-w="${esc(x)}">${esc(x)}</button>`).join('');
function dcHtml(r){
  if(!r)return '';
  if(r.def===undefined&&!r.syn.length&&!r.rhy.length)return '<p class="muted">Couldn’t reach the dictionary service. Check your connection and try again.</p>';
  const es=Array.isArray(r.def)?r.def:[];let h='';
  if(es.length){
    const e0=es[0],ph=(e0.phonetics||[]).find(p=>p&&typeof p.audio==='string'&&/^https:\/\//.test(p.audio)),
      txt=e0.phonetic||((e0.phonetics||[]).find(p=>p&&p.text)||{}).text||'';
    h+=`<div class="nt" style="margin:8px 0"><h3 style="margin:0">${esc(e0.word||r.w)}</h3>${txt?`<span class="muted">${esc(txt)}</span>`:''}${ph?`<button id="dcau" data-a="${esc(ph.audio)}" title="Hear it">🔊</button>`:''}</div>`;
    es.forEach(en=>(en.meanings||[]).forEach(m=>{
      h+=`<div class="note"><b><i>${esc(m.partOfSpeech||'')}</i></b><ol style="margin:6px 0 0;padding-left:20px">${(m.definitions||[]).slice(0,5).map(d=>`<li>${esc(d.definition||'')}${d.example?`<br><small class="muted">“${esc(d.example)}”</small>`:''}</li>`).join('')}</ol></div>`;
    }));
  }else{
    h+=`<p class="muted">No definition found for “${esc(r.w)}”.</p>`+(r.sug.length?`<p>Did you mean: ${dcChips(r.sug,6)}</p>`:'');
  }
  const own=es.flatMap(en=>(en.meanings||[]).flatMap(m=>[...(m.synonyms||[]),...(m.definitions||[]).flatMap(d=>d.synonyms||[])])),
    oan=es.flatMap(en=>(en.meanings||[]).flatMap(m=>[...(m.antonyms||[]),...(m.definitions||[]).flatMap(d=>d.antonyms||[])])),
    uni=l=>[...new Set(l.filter(x=>typeof x==='string'&&x&&x.toLowerCase()!==r.w))];
  const sec=(t,l,n)=>l.length?`<div class="note"><b>${t}</b><div style="margin-top:6px">${dcChips(l,n)}</div></div>`:'';
  return h+sec('Synonyms',uni([...own,...r.syn]),24)+sec('Antonyms',uni([...oan,...r.ant]),12)+sec('Rhymes',uni(r.rhy),20);
}
function showDict(w){
  tab='dictionary';trk();
  $('#ed').innerHTML=`<h2>Dictionary</h2><p class="muted">Meanings, synonyms, antonyms and rhymes. Tip: select a word in a chapter, then click Dictionary to look it up straight away.</p><div class="row"><input id="dci" placeholder="Look up a word…" value="${esc(w||dcWord)}" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="pri" id="dcb">Look up</button></div><div id="dch" style="margin:8px 0"></div><div id="dcr"></div>`;
  const hist=()=>{const el=$('#dch');if(el)el.innerHTML=dcHist().length?'<small class="muted">Recent: </small>'+dcChips(dcHist(),12):''};
  const go=async x=>{
    const word=dcClean(x);if(!word)return;
    dcWord=word;$('#dci').value=word;const my=++dcSeq;
    $('#dcr').innerHTML='<p class="muted">Looking up…</p>';
    let r=null;try{r=await dcLookup(word)}catch(e){}
    if(my!==dcSeq||!$('#dcr'))return;
    if(r&&r.def!==undefined)dcPush(word);
    $('#dcr').innerHTML=dcHtml(r)||'<p class="muted">Couldn’t reach the dictionary service. Check your connection and try again.</p>';
    hist();
  };
  $('#dcb').onclick=()=>go($('#dci').value);
  $('#dci').onkeydown=e=>{if(e.key==='Enter')go($('#dci').value)};
  const chip=e=>{const b=e.target.closest('.dcw');if(b)go(b.dataset.w)};
  $('#dch').onclick=chip;
  $('#dcr').onclick=e=>{
    chip(e);
    const a=e.target.closest('#dcau');
    if(a&&/^https:\/\//.test(a.dataset.a||'')){try{new Audio(a.dataset.a).play()}catch(_){}}
  };
  hist();
  const start=w||dcWord;
  if(start)go(start);else $('#dci').focus();
}

// ---- Delete one chapter (the person who started it, or who started the novel) ----
async function delChapter(id){
  const c=chapters.find(x=>x.id===id);
  if(!c||!canRen(c))return toast('Only the person who started this chapter or the novel can delete it.');
  clearTimeout(timer);dirty=false;armed=false;
  toast('Deleting “'+(c.title||'chapter')+'”…');
  const base='novels/'+novelId+'/chapters/'+id;
  try{
    for(const sub of ['comments','versions','marks'])await delCol(base+'/'+sub);
    await db.doc(base).delete();
    toast('Chapter deleted.');act('deleted “'+(c.title||'a chapter')+'”');
  }catch(e){fail(e)}
}
async function delNovel(id){
  const n=novels.find(x=>x.id===id);
  if(!n||!myId||n.by!==myId)return toast('Only the person who started this novel can delete it.');
  const ti=$('#dzi');if(novelId!==id||!ti||ti.value.trim()!==(n.title||'').trim())return toast('Type the novel’s title to confirm.');
  clearTimeout(timer);dirty=false;
  if(novelId===id)location.hash='';
  toast('Deleting “'+(n.title||'novel')+'”…');
  try{await wipeNovel(id);toast('Novel deleted.')}catch(e){fail(e)}
}
// ---- [[Links]] between chapters, codex entries and pages, plus backlinks ----
const LKRX=()=>/\[\[([^\[\]\n]{1,120}?)\]\]/g;
const lkName=t=>String(t).split('|')[0];
const unlink=h=>String(h||'').replace(/\[\[([^\[\]\n|]{1,120}?)(?:\|([^\[\]\n]{1,120}?))?\]\]/g,(m,a,b)=>b||a);
function linkTarget(name){
  const q=String(name||'').trim().toLowerCase();if(!q)return null;
  const cx=notes.find(n=>(n.name||'').trim().toLowerCase()===q);if(cx)return{kind:'cx',id:cx.id,label:cx.name};
  const ch=chapters.find(c=>(c.title||'').trim().toLowerCase()===q);if(ch)return{kind:'ch',id:ch.id,label:ch.title};
  const pg=pages.find(p=>(p.title||'').trim().toLowerCase()===q);if(pg)return{kind:'pg',id:pg.id,label:pg.title};
  return null;
}
function backlinks(kind,id){
  const out=[],chk=(text,src)=>{const rx=LKRX();let m;while((m=rx.exec(text||''))){const r=linkTarget(lkName(m[1]));if(r&&r.kind===kind&&r.id===id){out.push(src);return}}};
  chapters.forEach(c=>{if(!(kind==='ch'&&c.id===id))chk(c.content,{kind:'ch',id:c.id,label:c.title||'Untitled'})});
  notes.forEach(n=>{if(!(kind==='cx'&&n.id===id))chk(n.body,{kind:'cx',id:n.id,label:n.name||'Entry'})});
  pages.forEach(p=>{if(!(kind==='pg'&&p.id===id))chk(p.body,{kind:'pg',id:p.id,label:p.title||'Page'})});
  return out;
}
function flash(id){

  if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.style.outline='2px solid var(--acc)';setTimeout(()=>el.style.outline='',1600)}
}
async function goTo(r){

}
function linkGo(name){
  const t=lkName(name).trim(),r=linkTarget(t);
  if(!r)return toast('Nothing called “'+t+'” yet. Add it to the Codex, or name a chapter or page that.');
  goTo(r);
}
function hlLinks(){
  if(!window.CSS||!CSS.highlights||typeof Highlight==='undefined')return;
  const cb=$('#cb'),ok=[],bad=[];
  if(cb){
    const tw=document.createTreeWalker(cb,NodeFilter.SHOW_TEXT);
    while(tw.nextNode()){
      const t=tw.currentNode,v=t.nodeValue;if(v.indexOf('[[')<0)continue;
      const rx=LKRX();let m;
      while((m=rx.exec(v))){const r=new Range();r.setStart(t,m.index);r.setEnd(t,m.index+m[0].length);(linkTarget(lkName(m[1]))?ok:bad).push(r)}
    }
  }
  CSS.highlights.set('ink-link',new Highlight(...ok));
  CSS.highlights.set('ink-link-bad',new Highlight(...bad));
}
const blkItems=l=>l.map(x=>`<button class="bl" data-k="${x.kind}" data-id="${esc(x.id)}">${x.kind==='ch'?'📄':x.kind==='cx'?'📖':'🗂'} ${esc(x.label)}</button>`).join('');
function blkRender(){
  const l=$('#blkl');
  if(l&&chapId){
    const it=backlinks('ch',chapId);
    l.innerHTML=it.length?blkItems(it):'<p class="muted">Nothing links here yet. Type [[ and pick this chapter from another chapter, a codex entry or a page.</p>';
  }
  if(tab==='codex')$('#ed').querySelectorAll('.note[data-id]').forEach(el=>{
    const b=el.querySelector('.bld');if(!b)return;
    const it=backlinks('cx',el.dataset.id);b.innerHTML=it.length?'<small>Mentioned in</small> '+blkItems(it):'';
  });
  hlLinks();
}
function linkifyEl(root){
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];
  while(tw.nextNode())if(tw.currentNode.nodeValue.indexOf('[[')>=0)ns.push(tw.currentNode);
  ns.forEach(t=>{
    const v=t.nodeValue,rx=LKRX(),f=document.createDocumentFragment();let m,last=0,any=false;
    while((m=rx.exec(v))){
      any=true;f.append(v.slice(last,m.index));
      const parts=m[1].split('|'),tg=parts[0].trim(),al=parts.slice(1).join('|').trim(),a=document.createElement('a');
      a.className='wl'+(linkTarget(tg)?'':' bad');a.dataset.t=tg;a.textContent=al||tg;f.append(a);last=m.index+m[0].length;
    }
    if(any){f.append(v.slice(last));t.replaceWith(f)}
  });
}
function caretAt(x,y){
  if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);return p&&p.offsetNode&&p.offsetNode.nodeType===3?{node:p.offsetNode,offset:p.offset}:null}
  if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);return r&&r.startContainer.nodeType===3?{node:r.startContainer,offset:r.startOffset}:null}
  return null;
}
// type [[ in a chapter to pick something to link to
let lkBox=null,lkSel=0,lkItems=[],lkRange=null;
function lkClose(){if(lkBox){lkBox.remove();lkBox=null}lkItems=[]}
function lkDraw(){if(lkBox)lkBox.innerHTML=lkItems.map((x,i)=>`<div class="lki${i===lkSel?' on':''}" data-i="${i}"><span>${esc(x.label)}</span><small>${esc(x.sub||'')}</small></div>`).join('')}
function lkSuggest(){
  const cb=$('#cb'),sel=getSelection();
  if(!cb||!sel.rangeCount||!sel.isCollapsed||!cb.contains(sel.anchorNode)||sel.anchorNode.nodeType!==3)return lkClose();
  const t=sel.anchorNode,m=/\[\[([^\[\]\n|]*)$/.exec(t.nodeValue.slice(0,sel.anchorOffset));
  if(!m)return lkClose();
  const q=m[1].trim().toLowerCase(),seen=new Set();
  lkItems=[...notes.map(n=>({label:n.name||'',sub:n.kind||'Codex'})),...chapters.map(c=>({label:c.title||'',sub:'Chapter'})),...pages.map(p=>({label:p.title||'',sub:'Page'}))]
    .filter(x=>{const k=x.label.trim().toLowerCase();if(!k||seen.has(k)||(q&&!k.includes(q)))return false;seen.add(k);return true})
    .sort((a,b)=>(a.label.toLowerCase().startsWith(q)?0:1)-(b.label.toLowerCase().startsWith(q)?0:1)).slice(0,8);
  if(!lkItems.length)return lkClose();
  lkRange={node:t,start:m.index,end:sel.anchorOffset};lkSel=Math.min(lkSel,lkItems.length-1);
  const rr=sel.getRangeAt(0).cloneRange();rr.collapse(true);
  let rect=rr.getBoundingClientRect();if(!rect.width&&!rect.height&&!rect.left&&!rect.top)rect=cb.getBoundingClientRect();
  if(!lkBox){lkBox=document.createElement('div');lkBox.className='lkb';lkBox.onmousedown=e=>{e.preventDefault();const r=e.target.closest('.lki');if(r)lkPick(+r.dataset.i)};document.body.appendChild(lkBox)}
  lkBox.style.left=Math.max(8,Math.min(rect.left,innerWidth-330))+'px';
  lkBox.style.top=Math.min(rect.bottom+4,innerHeight-260)+'px';
  lkDraw();
}
function lkPick(i){
  const it=lkItems[i],rg=lkRange;if(!it||!rg||!rg.node.isConnected)return lkClose();
  const cb=$('#cb'),sel=getSelection(),r=document.createRange();
  r.setStart(rg.node,rg.start);r.setEnd(rg.node,rg.end);
  cb.focus();sel.removeAllRanges();sel.addRange(r);lkClose();
  document.execCommand('insertText',false,'[['+it.label+']]');
}
function linkWire(){
  lkClose();
  const cb=$('#cb');if(!cb||cb._lw)return;cb._lw=1;
  cb.addEventListener('input',()=>{lkSel=0;hlLinks();lkSuggest()});
  cb.addEventListener('blur',lkClose);
  cb.addEventListener('keydown',e=>{
    if(!lkBox)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();lkSel=(lkSel+(e.key==='ArrowDown'?1:-1)+lkItems.length)%lkItems.length;lkDraw()}
    else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();lkPick(lkSel)}
    else if(e.key==='Escape'){e.preventDefault();lkClose()}
  });
  cb.addEventListener('click',e=>{
    if(e.ctrlKey||e.metaKey){
      const p=caretAt(e.clientX,e.clientY);
      if(p){const v=p.node.nodeValue||'',rx=LKRX();let m;while((m=rx.exec(v))){if(p.offset>=m.index&&p.offset<=m.index+m[0].length){e.preventDefault();return linkGo(m[1])}}}
    }
    lkSuggest();
  });
}
// ---- Quick switcher (Ctrl+O / ⌘+O) ----
let qsEl=null,qsI=0,qsList=[];
function qsClose(){if(qsEl){qsEl.remove();qsEl=null}}
function qsItems(){
  const v=Object.keys(OTV).map(k=>({ic:OTV[k][0],label:OTV[k][1],sub:'View',go:()=>otGo(k)}));
  const ch=chapters.map(c=>({ic:'📄',label:c.title||'Untitled',sub:'Chapter',go:()=>goTo({kind:'ch',id:c.id})}));
  const cx=notes.map(n=>({ic:'📖',label:n.name||'',sub:'Codex · '+(n.kind||''),go:()=>goTo({kind:'cx',id:n.id})}));
  const pg=pages.map(p=>{const sp=spList().find(x=>x[0]===p.space);return{ic:'🗂',label:p.title||'Untitled',sub:'Spaces · '+(sp?sp[2]:''),go:()=>goTo({kind:'pg',id:p.id})}});
  return [...ch,...cx,...pg,...v].filter(x=>x.label.trim());
}
function qsFilter(q){
  const ts=q.toLowerCase().split(/\s+/).filter(Boolean);
  const sc=x=>{const l=x.label.toLowerCase(),h=l+' '+x.sub.toLowerCase();if(!ts.every(t=>h.includes(t)))return -1;return ts.length&&l.startsWith(ts[0])?0:1};
  return qsItems().map(x=>[sc(x),x]).filter(a=>a[0]>=0).sort((a,b)=>a[0]-b[0]).map(a=>a[1]).slice(0,12);
}
function qsDraw(){
  const l=$('#qsl');if(!l)return;
  l.innerHTML=qsList.length?qsList.map((x,i)=>`<div class="qsr${i===qsI?' on':''}" data-i="${i}"><span>${x.ic} ${esc(x.label)}</span><small>${esc(x.sub)}</small></div>`).join(''):'<p class="muted" style="padding:12px 16px;margin:0">No matches.</p>';
  const on=l.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'});
}
function qsPick(i){const x=qsList[i];if(!x)return;qsClose();x.go()}
function qsOpen(){
  if(!novelId||qsEl)return;
  qsEl=document.createElement('div');qsEl.id='qs';
  qsEl.innerHTML='<div class="qsb"><input id="qsi" placeholder="Jump to a chapter, codex entry, page or view…" autocomplete="off"><div id="qsl"></div></div>';
  document.body.appendChild(qsEl);
  const inp=$('#qsi');qsI=0;qsList=qsFilter('');qsDraw();inp.focus();
  inp.oninput=()=>{qsI=0;qsList=qsFilter(inp.value);qsDraw()};
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(qsList.length){qsI=(qsI+(e.key==='ArrowDown'?1:-1)+qsList.length)%qsList.length;qsDraw()}}

// ---- Tab shortcuts and drag to reorder ----
function otStep(d){
  if(!otabs.length)return;
  const i=otabs.indexOf(curKey());
  otGo(otabs[i<0?(d>0?0:otabs.length-1):(i+d+otabs.length)%otabs.length]);
}
let otDrag=null;
function otDragWire(){
  const el=$('#otb');if(!el)return;
  el.ondragstart=e=>{const t=e.target.closest&&e.target.closest('.ot');if(!t)return;otDrag=t.dataset.k;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',otDrag)}catch(x){}};
  el.ondragover=e=>{if(otDrag&&e.target.closest('.ot'))e.preventDefault()};
  el.ondrop=e=>{
    e.preventDefault();const t=e.target.closest('.ot'),k=otDrag;otDrag=null;
    if(!t||!k||t.dataset.k===k)return;
    const f=otabs.indexOf(k),to=otabs.indexOf(t.dataset.k);if(f<0||to<0)return;
    otabs.splice(to,0,otabs.splice(f,1)[0]);otSave();otRender();
  };
  el.ondragend=()=>{otDrag=null};
}
document.addEventListener('keydown',e=>{
  if(!novelId)return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&!e.altKey&&!e.shiftKey&&e.key&&e.key.toLowerCase()==='o'){e.preventDefault();qsEl?qsClose():qsOpen();return}
  if(e.altKey&&!mod&&!e.shiftKey){
    if(e.code==='KeyW'){e.preventDefault();const k=curKey();if(k)otClose(k)}
    else if(e.code==='BracketLeft'||e.code==='BracketRight'){e.preventDefault();otStep(e.code==='BracketRight'?1:-1)}
  }
});

  unsubVt=db.collection(`novels/${id}/vault`).onSnapshot(s=>{
    vault=s.docs.map(d=>({id:d.id,...d.data()}));resolve(vault.map(v=>v.by));
    if(tab!=='vault'||!$('#vtl'))return;
    vtList();
    const n=vault.find(v=>v.id===vtId);
    if(vtView==='graph')vtMain();
    else if(!n){vtId=null;vtMain()}
    else if(!$('#vtm').contains(document.activeElement))vtMain();
    else vtBack(n,vtIndex());
  },e=>fail(e));
}
function showVault(soft){

    $('#ed').innerHTML=`<h2>Vault</h2><p class="muted">Linked notes, like Obsidian. Link notes with [[double brackets]], tag with #tags, and open the graph to see how everything connects. Your co-author sees the vault too.</p><div class="tabs" id="vtv"><button data-v="notes">Notes</button><button data-v="graph">Graph</button></div><div class="vt"><div class="vtside"><input id="vts" placeholder="Search notes…" value="${esc(vtQ)}"><div class="row"><input id="vtn" placeholder="New note title"><button class="pri" id="vta">Add</button></div><button id="vtd">📅 Today’s note</button><div id="vtg" class="tabs"></div><div id="vtl"></div></div><div id="vtm"></div></div>`;

    $('#vts').oninput=e=>{vtQ=e.target.value.trim();vtList()};

function vtList(){

  const list=vault.filter(v=>(!q||(v.title+' '+(v.body||'')).toLowerCase().includes(q))&&(!vtTag||vtTags(v.body).includes(vtTag))).sort((a,b)=>(b.at||0)-(a.at||0));
  box.innerHTML=list.length?list.map(v=>{const bl=(idx.back.get(v.id)||[]).length;return `<button class="ch${v.id===vtId?' on':''}" data-id="${v.id}"><b>${esc(v.title)}</b><small>${bl} backlink${bl===1?'':'s'} · ${(idx.out.get(v.id)||[]).length} link${(idx.out.get(v.id)||[]).length===1?'':'s'}</small></button>`}).join(''):`<p class="muted">${vault.length?'No matches.':'No notes yet. Add one above.'}</p>`;

function vtBack(n,idx){
  const box=$('#vtb');if(!box)return;
  const back=idx.back.get(n.id)||[],out=idx.out.get(n.id)||[],bset=new Set(back.map(v=>v.id)),k=vtKey(n.title);
  const un=k.length>=3?vault.filter(v=>v.id!==n.id&&!bset.has(v.id)&&String(v.body||'').toLowerCase().includes(k)):[];
  const chip=v=>`<button class="vl" data-id="${v.id}">${esc(v.title)}</button>`;
  box.innerHTML=`<div class="note"><b>Backlinks (${back.length})</b><div class="tabs" style="margin-top:6px">${back.length?back.map(chip).join(''):'<small class="muted">Nothing links here yet.</small>'}</div></div>`
   +`<div class="note"><b>Links in this note (${out.length})</b><div class="tabs" style="margin-top:6px">${out.length?out.map(r=>{const t=idx.byKey.get(vtKey(r));return t?chip(t):`<button class="vl miss" data-new="${esc(r)}" title="Not created yet. Click to create it.">${esc(r)} ＋</button>`}).join(''):'<small class="muted">No [[links]] yet.</small>'}</div></div>`
   +(un.length?`<div class="note"><b>Unlinked mentions (${un.length})</b><div class="tabs" style="margin-top:6px">${un.map(chip).join('')}</div></div>`:'');
  box.onclick=e=>{const b=e.target.closest('.vl');if(!b)return;if(b.dataset.new)vtNew(b.dataset.new);else{vtId=b.dataset.id;vtView='notes';vtMain();vtList()}};
}
function vtGraph(box){
  const idx=vtIndex();
  let nodes=vault.slice().sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,150).map(v=>({id:v.id,label:v.title,ghost:false}));
  if(!nodes.length){box.innerHTML='<p class="muted">No notes yet. Add a few and link them with [[double brackets]] to see the graph.</p>';return}
  const byId=new Map(nodes.map(n=>[n.id,n])),ghosts=new Map();let edges=[];
  nodes.slice().forEach(n=>{(idx.out.get(n.id)||[]).forEach(r=>{
    const k=vtKey(r),t=idx.byKey.get(k);
    if(t){if(byId.has(t.id))edges.push([n.id,t.id])}
    else if(ghosts.size<60||ghosts.has(k)){let g=ghosts.get(k);if(!g){g={id:'g:'+k,label:r,ghost:true};ghosts.set(k,g)}edges.push([n.id,g.id])}
  })});
  ghosts.forEach(g=>{nodes.push(g);byId.set(g.id,g)});
  if(vtLocal&&byId.has(vtId)){
    const keep=new Set([vtId]);edges.forEach(([a,b])=>{if(a===vtId)keep.add(b);if(b===vtId)keep.add(a)});
    nodes=nodes.filter(n=>keep.has(n.id));edges=edges.filter(([a,b])=>keep.has(a)&&keep.has(b));
  }
  const W=760,H=480;vtLayout(nodes,edges,W,H);
  const pos=new Map(nodes.map(n=>[n.id,n]));
  const lines=edges.map(([a,b])=>`<line x1="${pos.get(a).x.toFixed(1)}" y1="${pos.get(a).y.toFixed(1)}" x2="${pos.get(b).x.toFixed(1)}" y2="${pos.get(b).y.toFixed(1)}" stroke="currentColor" stroke-opacity=".3"/>`).join('');
  const dots=nodes.map(n=>{
    const r=5+Math.sqrt(n.d)*2,cur=n.id===vtId,lab=n.label.length>22?n.label.slice(0,21)+'…':n.label;
    return `<g class="gn" data-id="${esc(n.id)}" style="cursor:pointer"><circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r.toFixed(1)}" style="${n.ghost?'fill:none;stroke:currentColor;stroke-dasharray:3 3':cur?'fill:var(--acc)':'fill:currentColor;fill-opacity:.7'}"/><text x="${n.x.toFixed(1)}" y="${(n.y+r+11).toFixed(1)}" font-size="10" text-anchor="middle" style="fill:currentColor">${esc(lab)}</text></g>`;
  }).join('');
  box.innerHTML=`<div class="nt"><b style="flex:1">Graph</b><label class="nt"><input type="checkbox" id="vtgl" ${vtLocal?'checked':''} style="width:auto"> <small>Only the open note and its neighbors</small></label></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px">${lines}${dots}</svg><small class="muted">Click a note to open it. Dashed circles are links to notes that don’t exist yet; click one to create it.</small>`;
  $('#vtgl').onchange=e=>{vtLocal=e.target.checked;vtMain()};
  box.querySelector('svg').onclick=e=>{
    const g=e.target.closest('.gn');if(!g)return;const id=g.dataset.id;
    if(id.startsWith('g:')){const n=pos.get(id);vtNew(n?n.label:id.slice(2))}
    else{vtId=id;vtView='notes';vtMain();vtList()}
  };
}
function vtMain(){
  const box=$('#vtm');if(!box)return;
  document.querySelectorAll('#vtv button').forEach(b=>b.classList.toggle('on2',b.dataset.v===vtView));
  if(vtView==='graph')return vtGraph(box);
  const n=vault.find(v=>v.id===vtId);
  if(!n){box.innerHTML='<p class="muted">Pick a note on the left, or create one. Inside a note, type [[ to link to another note.</p>';return}
  const idx=vtIndex(),id=n.id;
  box.innerHTML=`<div class="nt"><input id="vtt" value="${esc(n.title)}" style="font-size:1.2em;font-weight:700;flex:1;min-width:0"><button id="vtr" title="Switch between editing and reading (Ctrl+E)">${vtRead?'✏️ Edit':'👁 Read'}</button><button id="vtk" class="x">Delete</button></div>`
   +(vtRead?`<div class="vmd" id="vtp">${vtMd(n.body,idx)}</div>`:`<div style="position:relative;margin-top:8px"><textarea id="vtx" placeholder="Write here. Use [[Note name]] to link notes and #tags to organise.">${esc(n.body||'')}</textarea><div id="vtac" class="note" hidden style="position:absolute;z-index:5;margin:0;right:8px;top:8px;max-width:260px"></div></div>`)
   +`<div id="vtb"></div><small class="muted">Created by ${esc(nm(n.by))} · last edited ${new Date(n.at||0).toLocaleString()}</small>`;
  vtBack(n,idx);
  let t=null,ta=$('#vtx');
  const flush=()=>{if(t){clearTimeout(t);t=null;if(ta)vtRef(id).update({body:ta.value,at:Date.now()}).catch(fail)}};
  const ti=$('#vtt');
  ti.onchange=async()=>{flush();ti.value=await vtRename(id,ti.value)};
  $('#vtr').onclick=()=>{flush();vtRead=!vtRead;vtMain()};
  const x=$('#vtk');
  x.onclick=()=>{if(x.dataset.a){vtRef(id).delete().then(()=>{if(vtId===id)vtId=null}).catch(fail)}else{x.dataset.a=1;x.textContent='Sure?';setTimeout(()=>{delete x.dataset.a;x.textContent='Delete'},3000)}};
  const p=$('#vtp');
  if(p){
    p.onclick=e=>{
      const a=e.target.closest('a');if(!a)return;
      if(a.classList.contains('vwl')){e.preventDefault();const raw=a.dataset.t,tn=idx.byKey.get(vtKey(raw));if(tn){vtId=tn.id;vtMain();vtList()}else vtNew(raw)}
      else if(a.classList.contains('vtag')){e.preventDefault();vtTag=a.dataset.t;vtList()}
    };
    p.onchange=e=>{
      const c=e.target.closest('.vck');if(!c)return;
      const ls=String(n.body||'').split('\n'),l=+c.dataset.l;
      ls[l]=ls[l].replace(/\[( |x|X)\]/,(m,s)=>s===' '?'[x]':'[ ]');
      vtRef(id).update({body:ls.join('\n'),at:Date.now()}).catch(fail);
    };
  }
  if(ta){
    const ac=$('#vtac'),hide=()=>{ac.hidden=true;ac.innerHTML=''};
    const sugg=()=>{
      const m=/\[\[([^\[\]\n|#]*)$/.exec(ta.value.slice(0,ta.selectionStart));
      if(!m){hide();return}
      const q=vtKey(m[1]),hits=vault.filter(v=>v.id!==id&&(!q||vtKey(v.title).includes(q))).slice(0,6).map(v=>[v.title,0]);
      if(q&&!vault.some(v=>vtKey(v.title)===q))hits.push([m[1].trim(),1]);
      if(!hits.length){hide();return}
      ac.innerHTML=hits.map(([s,nw])=>`<button class="vl" data-t="${esc(s)}" style="display:block;width:100%;text-align:left">${nw?'＋ link to “'+esc(s)+'” (new)':esc(s)}</button>`).join('');ac.hidden=false;
    };
    const pick=s=>{
      const pos=ta.selectionStart,before=ta.value.slice(0,pos).replace(/\[\[([^\[\]\n|#]*)$/,'[['+s+']]'),after=ta.value.slice(pos).replace(/^\]\]/,'');
      ta.value=before+after;ta.setSelectionRange(before.length,before.length);hide();ta.dispatchEvent(new Event('input'));ta.focus();
    };
    ac.onmousedown=e=>e.preventDefault();
    ac.onclick=e=>{const b=e.target.closest('button');if(b)pick(b.dataset.t)};
    ta.oninput=()=>{clearTimeout(t);t=setTimeout(flush,700);sugg()};
    ta.onblur=()=>{flush();setTimeout(hide,150)};
    ta.onclick=sugg;
    ta.onkeyup=e=>{if(!['Enter','Tab','Escape'].includes(e.key))sugg()};
    ta.onkeydown=e=>{
      if(!ac.hidden&&(e.key==='Enter'||e.key==='Tab')){const b=ac.querySelector('button');if(b){e.preventDefault();pick(b.dataset.t)}}
      else if(e.key==='Escape')hide();
      else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'){e.preventDefault();flush();vtRead=true;vtMain()}
    };
  }
}

let asts=null;use('assets').then(a=>{asts=a});

let flt='all';

function hlP(v){
  // Highlight every text run in the paragraph(s) on its own, so the colour sits inside
  // each run's own font size instead of wrapping around larger text and being cut off.
  const cb=$('#cb'),blk=n=>{while(n&&n!==cb&&!/^(P|DIV)$/.test(n.nodeName))n=n.parentNode;return n&&n!==cb?n:null};
  if(!rng||!cb.contains(rng.commonAncestorContainer))return toast('Click inside a paragraph first.');
  const flat=!cb.querySelector('p,div');
  const a=blk(rng.startContainer)||(flat?cb:null),b=blk(rng.endContainer)||(flat?cb:null);
  if(!a||!b)return toast('Click inside a paragraph first.');
  const r=document.createRange();
  if(a===cb)r.selectNodeContents(cb);else{r.setStart(a,0);r.setEnd(b,b.childNodes.length)}
  const tw=document.createTreeWalker(cb,NodeFilter.SHOW_TEXT),ns=[];
  while(tw.nextNode()){const t=tw.currentNode;if(t.nodeValue&&r.intersectsNode(t))ns.push(t)}
  if(!ns.length)return;
  cb.focus();const sel=getSelection();
  for(let i=ns.length-1;i>=0;i--){
    const t=ns[i];if(!t.isConnected)continue;
    const x=document.createRange();x.selectNodeContents(t);
    sel.removeAllRanges();sel.addRange(x);
    document.execCommand('hiliteColor',false,v);
  }
  try{sel.removeAllRanges();sel.addRange(r);rng=r.cloneRange()}catch(e){}
  cb.dispatchEvent(new Event('input'));
}
