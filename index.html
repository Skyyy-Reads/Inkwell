// Replace text through the browser's own editing commands so Undo/Redo can reverse it.
function edSub(rx,to,pre){
  const cb=$('#cb'),sel=getSelection(),tw=document.createTreeWalker(cb,NodeFilter.SHOW_TEXT),ns=[];let n=0;
  while(tw.nextNode())ns.push(tw.currentNode);
  cb.focus();
  ns.forEach(t=>{
    const ms=[];let m;rx.lastIndex=0;
    while((m=rx.exec(t.nodeValue))){const a=m.index+(pre?m[1].length:0);ms.push([a,m[0].length-(pre?m[1].length:0)]);if(m[0]==='')rx.lastIndex++}
    for(let i=ms.length-1;i>=0&&t.isConnected;i--){
      const r=document.createRange();r.setStart(t,ms[i][0]);r.setEnd(t,ms[i][0]+ms[i][1]);
      sel.removeAllRanges();sel.addRange(r);
      document.execCommand(to===''?'delete':'insertText',false,to);n++;
    }
  });
  return n;
}
function spellFix(from,to){

  edSub(new RegExp("(^|[^A-Za-z])"+rxEsc(from)+"(?![A-Za-z]|['’][A-Za-z])",'g'),to,true);
  $('#cb').dispatchEvent(new Event('input'));
}
async function spellRun(){
  const my=++spRun,st=$('#sps'),lst=$('#spl');if(!st||!lst)return;
  lst.innerHTML='';st.textContent='Loading dictionary…';

  if(my!==spRun||!$('#spl'))return;
  const skipCap=$('#spc').checked,mine=new Set(myWords().map(w=>w.toLowerCase())),seen=new Map();
  notes.forEach(n=>String(n.name||'').split(/[^A-Za-z'’]+/).forEach(w=>{if(w)mine.add(w.replace(/’/g,"'").toLowerCase())}));
  for(const m of $('#cb').value.matchAll(/[A-Za-z]+(?:['’][A-Za-z]+)*/g)){
    const w=m[0],k=w.replace(/’/g,"'");
    if(w.length<2||w===w.toUpperCase()||(skipCap&&/^[A-Z]/.test(w))||mine.has(k.toLowerCase())||spIgn.has(k.toLowerCase()))continue;
    if(typo.check(k))continue;

  }
  const all=[...seen.entries()],list=all.slice(0,40);
  if(!all.length){st.textContent='No misspelled words found 🎉';return}
  st.textContent=all.length+' possible misspelling'+(all.length>1?'s':'')+(all.length>40?' (showing first 40)':'');
  list.forEach(([w,n])=>{
    const r=document.createElement('div');r.className='nt';r.style.cssText='flex-wrap:wrap;margin:6px 0';
    r.innerHTML=`<b>${esc(w)}</b><small>×${n}</small><span class="sg"><small>…</small></span><button class="ig">Ignore</button><button class="ad" title="Save to this browser's dictionary">Add to dictionary</button>`;
    r.querySelector('.ig').onclick=()=>{spIgn.add(w.replace(/’/g,"'").toLowerCase());r.remove()};
    r.querySelector('.ad').onclick=()=>{try{const a=myWords();a.push(w.replace(/’/g,"'").toLowerCase());localStorage.setItem(SPK,JSON.stringify(a))}catch(e){}r.remove()};
    lst.appendChild(r);
  });
  for(const r of lst.children){

let baseHtml='',svAt=0,fsBase=0;
function lcsPairs(a,b){
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){out.push([i,j]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return out;
}
function merge3(base,mine,theirs){
  if(base.length*Math.max(mine.length,theirs.length)>4e6)return null;
  const A=new Map(lcsPairs(base,mine)),B=new Map(lcsPairs(base,theirs)),anc=[];
  A.forEach((mi,bi)=>{if(B.has(bi))anc.push([bi,mi,B.get(bi)])});
  anc.sort((x,y)=>x[0]-y[0]);anc.push([base.length,mine.length,theirs.length]);
  const eq=(x,y)=>x.length===y.length&&x.every((v,k)=>v===y[k]),out=[];let pb=0,pm=0,pt=0;
  for(const [bi,mi,ti] of anc){
    const cb=base.slice(pb,bi),cm=mine.slice(pm,mi),ct=theirs.slice(pt,ti);
    if(eq(cm,cb))out.push(...ct);else if(eq(ct,cb)||eq(cm,ct))out.push(...cm);else return null;
    if(bi<base.length)out.push(base[bi]);
    pb=bi+1;pm=mi+1;pt=ti+1;
  }
  return out;
}
const blocksOf=h=>{const d=new DOMParser().parseFromString('<body>'+(h||'')+'</body>','text/html').body;return [...d.childNodes].map(n=>n.nodeType===1?n.outerHTML:(n.textContent.trim()?esc(n.textContent):'')).filter(Boolean)};
function mergeIn(c){
  try{

    const cb=$('#cb'),B=blocksOf(baseHtml),M=blocksOf(cb.html),T=blocksOf(clean(c.html,1)),out=merge3(B,M,T);
    if(!out)return false;
    const s=getSelection(),md=wc(cb.value)-lastWc;let keep=null;
    if(s.rangeCount&&cb.contains(s.anchorNode)&&s.anchorNode!==cb){
      let n=s.anchorNode;while(n&&n.parentNode!==cb)n=n.parentNode;
      if(n){const r=document.createRange();r.setStart(n,0);r.setEnd(s.anchorNode,s.anchorOffset);keep={html:n.outerHTML,off:r.toString().length}}
    }
    cb.html=out.join('');
    if(keep){
      const el=[...cb.children].find(x=>x.outerHTML===keep.html);
      if(el){
        const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let left=keep.off,t=null,last=null;
        while((t=tw.nextNode())){last=t;if(left<=t.nodeValue.length){s.collapse(t,left);last=null;break}left-=t.nodeValue.length}
