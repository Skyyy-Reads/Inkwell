<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkwell: Co-write Webnovels</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2622;--mut:#7a7167;--card:#fff;--line:#e6dfd4;--acc:#8a4b2a;--accfg:#fff;--warn:#fff3d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--fg:#ece6dd;--mut:#a39a8e;--card:#262320;--line:#3a352f;--acc:#d9915f;--accfg:#1c1a18;--warn:#3d3319}}
:root[data-theme="dark"]{--bg:#1c1a18;--fg:#ece6dd;--mut:#a39a8e;--card:#262320;--line:#3a352f;--acc:#d9915f;--accfg:#1c1a18;--warn:#3d3319}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.brand{font:700 20px Georgia,"Times New Roman",serif}
.who,.muted,small{color:var(--mut)}
.wrap{max-width:820px;margin:0 auto;padding:24px 20px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:.2em 0}
input,textarea,button{font:inherit;color:inherit}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button.pri,button.on2{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.row input{flex:1 1 200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card:hover{border-color:var(--acc)}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 60px)}
aside{border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:8px}
.ch{display:block;width:100%;text-align:left}
.ch small{display:block}
.ch.on{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
#ed{padding:18px 24px;max-width:820px;width:100%}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.bar .sp{flex:1}
.ctitle{font:700 26px Georgia,serif;border:none;background:transparent;padding:6px 0}
#cb{min-height:60vh;font:18px/1.8 Georgia,"Times New Roman",serif;resize:vertical}
.read{font:18px/1.9 Georgia,"Times New Roman",serif}
.read p{margin:0 0 1em;text-indent:1.5em}
.warn{background:var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.foot{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90%}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;border-radius:99px;padding:1px 8px;border:1px solid var(--line);margin-left:6px;vertical-align:middle;color:var(--mut)}
.badge.Ready{border-color:var(--acc);color:var(--acc)}
.badge.Published{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.note textarea{min-height:90px;margin-top:8px}
.nt{display:flex;gap:8px;align-items:center}
.book{max-width:680px;margin:0 auto}
.book h2{text-align:center;margin-top:2em}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--acc)}
.prog:empty{display:none}
.pin{padding:4px 10px}
.cm{margin-top:28px;border-top:1px solid var(--line);padding-top:10px}
.cm .note{padding:8px 12px;margin-bottom:6px}
#xf{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:5}
.focus #xf{display:block}
.focus aside,.focus .top{display:none}
.focus .layout{grid-template-columns:1fr}
.focus #ed{margin:0 auto}
.tp{text-align:center;margin:1em 0 2.5em}
.book .read{font-size:var(--fs,18px)}
.ch small+small{font-style:italic}
span[style*="background-color"]{color:#2a2622}
.at{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.atc{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px}.atc img{max-height:48px;border-radius:4px}.atc a{text-decoration:underline}.atb{cursor:pointer;color:var(--acc);font-size:14px}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:3}
.tb[hidden]{display:none}
.tb button{min-width:36px}
div#cb{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;overflow-wrap:anywhere;min-height:60vh;font:18px/1.8 Georgia,"Times New Roman",serif}
div#cb:focus{border-color:var(--acc)}
div#cb p{margin:0 0 1em}
div#cb:empty:before{content:attr(data-ph);color:var(--mut)}
hr{border:0;margin:1.5em 0;text-align:center;height:1.5em}
hr:before{content:"* * *";letter-spacing:.6em;color:var(--mut)}
.tp p{text-indent:0}
#tg{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:38px;height:38px;padding:0;border-radius:50%;z-index:4}
@media (max-width:700px){.layout{grid-template-columns:1fr}aside{border-right:none;border-bottom:1px solid var(--line)}#ed{padding:14px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<button id="xf">Exit focus</button>
<button id="tg" title="Switch light or dark theme">◐</button>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
// ====== PASTE YOUR FIREBASE WEB CONFIG HERE (Firebase console > Project settings > Your apps) ======
const FIREBASE_CONFIG={apiKey:"AIzaSyBLunfez0vVDKxRwDy3q5JXXC9JHyZl_m8",authDomain:"inkwell-ade0e.firebaseapp.com",projectId:"inkwell-ade0e",appId:"1:167126808618:web:2c30684ce1a232edca2b53"};
// ====================================================================================================
// Adapter: gives the app the same db/user/room/downloads interface it had on claude.ai, backed by Firebase.
(()=>{
const ok=!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId),$a=()=>document.getElementById('app');
let fdb=null,auth=null,authP=null,cache={};
function setup(){$a().innerHTML='<div class="wrap"><h1>Almost there</h1><p class="muted">Add your Firebase config at the top of this file (see README.md), then reload.</p></div>'}
function signedIn(){
  return authP||(authP=new Promise(res=>{
    auth.onAuthStateChanged(u=>{
      if(u)return res(u);
      $a().innerHTML='<div class="wrap"><h1>✒️ Inkwell</h1><p class="muted">Pick the name your co-author will see.</p><div class="row"><input id="gnm" placeholder="Your name" maxlength="40"><button class="pri" id="gsi">Start writing</button></div></div>';
      const gi=document.getElementById('gnm');try{gi.value=localStorage.getItem('ink-name')||''}catch(e){}
      const go=()=>{const n=gi.value.trim();if(!n)return gi.focus();try{localStorage.setItem('ink-name',n)}catch(e){}auth.signInAnonymously().catch(x=>alert(x.message))};
      document.getElementById('gsi').onclick=go;gi.onkeydown=e=>{if(e.key==='Enter')go()};
    });
  }));
}
const userNs={
  me:async()=>{const u=await signedIn();let name='Guest';try{name=localStorage.getItem('ink-name')||'Guest'}catch(e){}await fdb.doc('profiles/'+u.uid).set({name},{merge:true});return{id:u.uid,name}},
  id:async()=>(await signedIn()).uid,
  profiles:async ids=>{const o={};await Promise.all(ids.map(async i=>{try{const s=await fdb.doc('profiles/'+i).get();o[i]={name:s.exists?s.data().name:''}}catch(e){o[i]={name:''}}}));return o}
};
const dl={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return{status:'saved'}}};
async function mkRoom(){
  const u=await signedIn(),col=fdb.collection('presence'),ref=col.doc(u.uid);let cur={},list=[],fns=[];
  const beat=()=>ref.set({...cur,uid:u.uid,at:Date.now()}).catch(()=>{});
  col.onSnapshot(s=>{list=s.docs.map(d=>d.data());fns.forEach(f=>f())},()=>{});
  setInterval(beat,15000);setInterval(()=>fns.forEach(f=>f()),10000);
  window.addEventListener('beforeunload',()=>ref.delete().catch(()=>{}));
  return{presence:async p=>{cur=p;await beat()},peers:()=>list.filter(d=>Date.now()-d.at<40000).map(d=>({isMe:d.uid===u.uid,presence:d})),onPeers:f=>fns.push(f)};
}
async function load(n){
  if(!ok){setup();return new Promise(()=>{})}
  if(!fdb){firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fdb=firebase.firestore()}
  if(n==='db'){await signedIn();return fdb}
  if(n==='user'){await signedIn();return userNs}
  if(n==='room')return mkRoom();
  if(n==='downloads')return dl;
  return null; // 'assets' (file attachments) is off in the GitHub build
}
window.claude={use:n=>cache[n]||(cache[n]=load(n))};
})();
</script>
<script>
(async()=>{
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wc=t=>((t||'').match(/\S+/g)||[]).length;
let db=null,user=null,myId=null,myName='Guest',names={},novels=[],chapters=[],novelId=null,chapId=null,pending=null;
let unsubC=null,dirty=false,timer=null,savedAt=0,built=false,armed=false,unsubN2=null,notes=[],tab='ed',drafts=false;
const nm=id=>id===myId?'you':(names[id]||'Someone');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4500)}
function fail(e){toast(e&&e.code==='not_granted'?'You can view this but not edit. Ask the owner to make you a Contributor.':'Something went wrong: '+((e&&e.message)||e))}

app.innerHTML='<p class="wrap muted">Loading…</p>';
const use=window.claude&&claude.use?claude.use.bind(claude):async()=>null;
db=await use('db');user=await use('user');
if(!db){app.innerHTML='<div class="wrap"><h1>Sign in to start writing</h1><p class="muted">Open this page in claude.ai while signed in to co-write.</p></div>';return}
try{const me=await user.me();myId=me.id;myName=me.name||'Guest'}catch(e){}

async function resolve(ids){
  ids=[...new Set(ids.filter(Boolean))].filter(i=>!names[i]);
  if(!ids.length||!user)return;
  try{const p=await user.profiles(ids);for(const i in p)names[i]=p[i].name||'Someone'}catch(e){}
  refresh();
}
function refresh(){novelId?(updNovel(),showStats(),chapId&&(showCm(chapId),showVh(chapId))):updHome()}

function buildHome(){
  app.innerHTML=`<div class="top"><div class="brand">✒️ Inkwell</div><div class="who">${esc(myName)}</div></div>
  <main class="wrap"><h1>Your novels</h1><p class="muted">Start a story, then share this page’s link with your co-author.</p>
  <div class="row"><input id="nt" placeholder="Novel title"><input id="ns" placeholder="One-line premise (optional)"><button class="pri" id="nc">Create novel</button></div>
  <div id="list" class="grid"></div></main>`;
  $('#nc').onclick=()=>{
    const title=$('#nt').value.trim();if(!title)return toast('Give your novel a title first.');
    db.collection('novels').add({title,synopsis:$('#ns').value.trim(),by:myId,createdAt:Date.now()}).then(r=>{location.hash=r.id}).catch(fail);
  };
}
function updHome(){
  const l=$('#list');if(!l)return;
  l.innerHTML=novels.length?novels.map(n=>`<a class="card" href="#${n.id}"><h3>${esc(n.title)}</h3><p class="muted">${esc(n.synopsis)}</p><small>Started by ${esc(nm(n.by))}</small></a>`).join(''):'<p class="muted">No novels yet. Create the first one above.</p>';
}

function buildNovel(){
  app.innerHTML=`<div class="top"><a href="#" class="brand" id="back">← Inkwell</a><div class="who" id="pr">${esc(myName)}</div></div>
  <div class="layout"><aside><h2 id="nvt"></h2><p class="muted" id="nvs"></p><div id="gp"></div><div id="wd"></div><div id="lv"></div><div id="sp"></div><input id="gi" type="number" min="0" placeholder="Word goal (optional)"><input id="sq" placeholder="Search chapters and codex…"><div class="tabs"><button id="bcx">📖 Codex</button><button id="bbk">Read novel</button><button id="bol">Outline</button><button id="btl">Timeline</button><button id="bnt">Notes</button><button id="bsp">🗂 Spaces</button><button id="bfl">📎 Files</button><button id="bpr">💡 Prompt</button></div><div class="note" id="pm" hidden></div><div id="chl"></div><button class="pri" id="addc">+ New chapter</button></aside>
  <section id="ed"><p class="muted">Pick or create a chapter to begin.</p></section></div>`;
  $('#back').onclick=async e=>{await save()};
  $('#bcx').onclick=async()=>{await save();chapId=null;updNovel();setPres();showCodex()};
  $('#bbk').onclick=async()=>{await save();chapId=null;updNovel();setPres();showBook()};
  $('#sq').oninput=updNovel;
  $('#bol').onclick=async()=>{await save();chapId=null;updNovel();setPres();showOutline()};
  $('#btl').onclick=async()=>{await save();chapId=null;updNovel();setPres();showTimeline()};
  $('#bnt').onclick=async()=>{await save();chapId=null;updNovel();setPres();showMemos()};
  $('#bsp').onclick=async()=>{await save();chapId=null;updNovel();showSpaces();setPres()};
  $('#bfl').onclick=async()=>{await save();chapId=null;updNovel();showFiles();setPres()};
  $('#sp').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=+b.dataset.m;if(m){sprintEnd=Date.now()+m*60000;sprintW=0}else sprintEnd=0;$('#sp').dataset.s='';sprintUI()};
  $('#bpr').onclick=()=>{const p=$('#pm');p.textContent=PROMPTS[Math.floor(Math.random()*PROMPTS.length)];p.hidden=false};
  $('#gi').onchange=e=>db.doc('novels/'+novelId).update({goal:Math.max(0,parseInt(e.target.value)||0)}).catch(fail);
  $('#chl').onclick=async e=>{
    const b=e.target.closest('.ch');if(!b||b.dataset.id===chapId)return;if(b.dataset.cx){await save();chapId=null;updNovel();setPres();return showCodex()}
    await save();open(b.dataset.id);
  };
  $('#addc').onclick=async()=>{
    await save();
    const order=chapters.length?Math.max(...chapters.map(c=>c.order||0))+1:1;
    db.collection(`novels/${novelId}/chapters`).add({title:'Chapter '+order,content:'',order,by:myId,updatedBy:myId,updatedAt:Date.now()})
      .then(r=>{pending=r.id}).catch(fail);
  };
}
function updNovel(){
  if(!$('#nvt'))return;
  const n=novels.find(x=>x.id===novelId);
  $('#nvt').textContent=n?n.title:(novels.length?'Novel not found':'Loading…');
  $('#nvs').textContent=n&&n.synopsis||'';
  const tw=chapters.reduce((a,c)=>a+wc(c.content),0),g=n&&n.goal||0;
  $('#gp').innerHTML=`<small>${tw.toLocaleString()} words${g?` of ${g.toLocaleString()}`:''}</small>`+(g?`<div class="prog"><i style="width:${Math.min(100,tw/g*100)}%"></i></div>`:'');
  if(document.activeElement!==$('#gi'))$('#gi').value=g||'';
  const q=($('#sq').value||'').trim().toLowerCase(),vis=q?chapters.filter(c=>((c.title||'')+' '+(c.content||'')).toLowerCase().includes(q)):chapters;
  const cxm=q?notes.filter(x=>((x.name||'')+' '+(x.body||'')).toLowerCase().includes(q)).map(x=>`<button class="ch" data-cx="1"><b>${esc(x.name)}</b><span class="badge">${esc(x.kind)}</span><small>In the codex</small></button>`).join(''):'';
  $('#chl').innerHTML=(vis.length?vis.map(c=>`<button class="ch${c.id===chapId?' on':''}" data-id="${c.id}"><b>${esc(c.title)}</b><span class="badge ${c.status||'Draft'}">${c.status||'Draft'}</span>${c.openMarks?`<span class="badge" title="Open comments">💬 ${c.openMarks}</span>`:''}<small>${wc(c.content)} words · edited by ${esc(nm(c.updatedBy))}</small>${live(c.id).map(p=>`<small style="color:var(--acc)">● ${esc(p.presence.name||'Someone')}${p.presence.typing?' is typing…':' is here'}</small>`).join('')}${q?snip(c,q):''}${c.tags?`<small>${esc(c.tags)}</small>`:''}</button>`).join(''):(q?'':'<p class="muted">No chapters yet.</p>'))+cxm+(q&&!vis.length&&!cxm?'<p class="muted">No matches.</p>':'');
  if(pending&&chapters.some(c=>c.id===pending)){const p=pending;pending=null;open(p)}
}
function subC(){
  unsubC=db.collection(`novels/${novelId}/chapters`).orderBy('order').onSnapshot(s=>{
    chapters=s.docs.map(d=>({id:d.id,...d.data()}));
    resolve(chapters.map(c=>c.updatedBy));if(tab==='files')showFiles();if(tab==='book')showBook();if(tab==='outline'&&!$('#ed').contains(document.activeElement))showOutline();
    updNovel();
    if(chapId){const c=chapters.find(x=>x.id===chapId);
      if(c){sync(c);const w=$('#caw');if(w&&w.dataset.id===chapId)attFill(w,db.doc(`novels/${novelId}/chapters/${chapId}`),()=>chapters)}else if(!pending){chapId=null;dirty=false;$('#ed').innerHTML='<p class="muted">That chapter was deleted.</p>'}}
  },fail);
}

function open(id){
  const c=chapters.find(x=>x.id===id);if(!c)return;
  chapId=id;tab='ed';dirty=false;armed=false;savedAt=c.updatedAt;
  $('#ed').innerHTML=`<div class="bar"><button id="mw" class="on2">Write</button><button id="mr">Read</button><span class="sp"></span><select id="sts"><option>Draft</option><option>Ready</option><option>Published</option></select><button id="fc">Focus</button><button id="fr">Find</button><select id="dlf"><option value="">⬇ Download</option><option value="txt">Text (.txt)</option><option value="md">Markdown (.md)</option><option value="html">Web page (.html)</option></select><button id="hs">History</button><button id="up" title="Move up">↑</button><button id="dn" title="Move down">↓</button><span id="st" class="muted"></span><button id="dc">Delete</button></div>
  <div class="warn" id="warn" hidden>Your co-author saved changes to this chapter. <button id="ld">Load their version</button> <small>(replaces your unsaved edits)</small></div>
  <input id="ct" class="ctitle" placeholder="Chapter title"><div class="row" style="margin:0 0 8px"><input id="ctg" placeholder="Tags or content warnings (comma-separated)"><input id="cwt" type="number" min="0" placeholder="Chapter word goal" style="flex:0 1 170px"></div><div class="prog" id="cpg"></div><div class="row" id="frr" hidden style="margin:0 0 8px"><input id="fi" placeholder="Find"><input id="fo" placeholder="Replace with"><button id="fa">Replace all</button><small id="fn"></small></div><div class="tb" id="tb"><button data-c="bold" title="Bold (Ctrl+B)"><b>B</b></button><button data-c="italic" title="Italic (Ctrl+I)"><i>I</i></button><button data-c="underline" title="Underline (Ctrl+U)"><u>U</u></button><select id="ff"><option value="">Font</option>${FONTS.map(f=>`<option>${f}</option>`).join('')}</select><select id="fz"><option value="">Size</option>${[12,14,16,18,20,24,28,36,48].map(s=>`<option>${s}</option>`).join('')}</select><button data-c="justifyLeft" title="Align left">⇤</button><button data-c="justifyCenter" title="Center">↔</button><button data-c="justifyRight" title="Align right">⇥</button><select id="fk"><option value="">Color</option>${COLORS.map(([n,v])=>`<option value="${v}">${n}</option>`).join('')}</select><button data-c="hr" title="Insert a scene break">* * *</button><select id="hl"><option value="">Highlight</option>${HLO}</select><select id="hp"><option value="">¶ Highlight</option>${HLO}</select><button id="cmt" title="Comment on selected text">💬</button><button data-c="removeFormat" title="Clear formatting">Clear</button></div><div class="row" id="cmr" hidden style="margin:0 0 8px"><input id="cmv" placeholder="Comment on the selected text…"><button class="pri" id="cmo">Comment</button><button id="cmx">Cancel</button></div><div id="cb" contenteditable="true" data-ph="Once upon a time…"></div><div id="rd" class="read" hidden></div><div id="caw" data-id="${id}"><div class="at"></div></div>
  <div class="foot"><span id="wcn"></span><span id="lb" class="muted"></span></div>
  <div class="cm" id="vh" hidden><h3>Version history</h3><button id="sv">Save a version now</button><div id="vl" style="margin-top:10px"></div></div>
  <div class="cm"><h3>Inline comments</h3><div id="mkl"></div></div>

  el.innerHTML='<small>⏱ '+Math.floor(l/60)+':'+String(l%60).padStart(2,'0')+' · '+sprintW+' words</small> <button data-m="0">Stop</button>';
}
setInterval(()=>{if(sprintEnd&&Date.now()>=sprintEnd){toast('Sprint over! You wrote '+sprintW+' words.');sprintEnd=0}sprintUI()},1000);
const BASE=[['drafts','📝','Drafts'],['ideas','💡','Ideas'],['themes','🎭','Themes'],['characters','👤','Characters']];
const spList=()=>BASE.concat(spaces.map(x=>[x.id,'📁',x.name]));
const sph=l=>l.length+' page'+(l.length===1?'':'s')+' · '+l.reduce((a,p)=>a+wc(p.body),0).toLocaleString()+' words';
const pgMeta=p=>'edited by '+nm(p.updatedBy||p.by)+' · '+new Date(p.updatedAt||p.at||0).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · '+wc(p.body)+' words';
const inSp=()=>pages.filter(p=>p.space===spTab).sort((a,b)=>(a.at||0)-(b.at||0));
function subSpaces(){
  const id=novelId;
  unsubSp=db.collection(`novels/${id}/spaces`).orderBy('at').onSnapshot(s=>{spaces=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='spaces'&&!$('#ed').contains(document.activeElement))showSpaces()},()=>{});
  unsubPg=db.collection(`novels/${id}/pages`).onSnapshot(s=>{
    pages=s.docs.map(d=>({id:d.id,...d.data()}));resolve(pages.map(p=>p.updatedBy));
    if(tab==='files')showFiles();if(tab!=='spaces')return;
    if(!$('#ed').contains(document.activeElement))showSpaces();else pgSync();
  },()=>{});
}
function pgSync(){
  const cur=inSp(),ed=$('#ed'),have=[...ed.querySelectorAll('.note')].map(e=>e.dataset.id);
  if(cur.map(p=>p.id).join()!==have.join()){stale=true;return}
  $('#sph').textContent=sph(cur);
  ed.querySelectorAll('.note').forEach(el=>{
    const p=cur.find(x=>x.id===el.dataset.id),ta=el.querySelector('textarea'),ti=el.querySelector('.mtl');if(!p)return;
    if(document.activeElement!==ta&&ta.value!==(p.body||''))ta.value=p.body||'';
    if(document.activeElement!==ti&&ti.value!==(p.title||''))ti.value=p.title||'';
    el.querySelector('small').textContent=pgMeta(p);
    attFill(el,db.doc(`novels/${novelId}/pages/${el.dataset.id}`),()=>pages);
  });
}
function showSpaces(){
  tab='spaces';stale=false;
  const sl=spList();if(!sl.some(x=>x[0]===spTab))spTab='drafts';
  const cur=inSp();
  $('#ed').innerHTML=`<h2>Spaces</h2><p class="muted">Separate rooms for drafts, ideas, themes and characters. You and your co-author see each other’s edits live.</p><div class="tabs" id="spt">${sl.map(x=>`<button data-s="${esc(x[0])}" class="${x[0]===spTab?'on2':''}">${x[1]} ${esc(x[2])}</button>`).join('')}</div><div class="row"><input id="snn" placeholder="New space name (e.g. Worldbuilding)"><button id="sna">Create space</button></div><p class="muted" id="sph">${sph(cur)}</p><div class="row"><input id="pgt" placeholder="New page title"><button class="pri" id="pga">Add page</button></div>`+(cur.length?cur.map(p=>`<div class="note" data-id="${p.id}"><div class="nt"><input class="mtl" value="${esc(p.title)}" style="font-weight:700"><button class="pd" title="Download this page">⬇</button><button class="pm" title="Copy this page into a new chapter">→ Chapter</button><button class="x">Delete</button></div><textarea placeholder="Write here…">${esc(p.body)}</textarea><div class="at"></div><small>${pgMeta(p)}</small></div>`).join(''):'<p class="muted">Nothing in this space yet. Add a page above.</p>');
  $('#spt').onclick=e=>{const b=e.target.closest('button');if(b){spTab=b.dataset.s;showSpaces()}};
  $('#sna').onclick=()=>{const name=$('#snn').value.trim();if(!name)return toast('Name the space first.');db.collection(`novels/${novelId}/spaces`).add({name,by:myId,at:Date.now()}).then(r=>{spTab=r.id;showSpaces()}).catch(fail)};
  $('#pga').onclick=()=>{const title=$('#pgt').value.trim();if(!title)return toast('Give the page a title first.');const n=Date.now();db.collection(`novels/${novelId}/pages`).add({space:spTab,title,body:'',by:myId,updatedBy:myId,at:n,updatedAt:n}).catch(fail)};
  $('#ed').onfocusout=()=>setTimeout(()=>{if(tab==='spaces'&&stale&&!$('#ed').contains(document.activeElement))showSpaces()},50);
  $('#ed').querySelectorAll('.note').forEach(el=>{
    const ref=db.doc(`novels/${novelId}/pages/${el.dataset.id}`),ta=el.querySelector('textarea'),ti=el.querySelector('.mtl'),x=el.querySelector('.x');let t;
    attFill(el,ref,()=>pages);
    el.querySelector('.pd').onclick=()=>dlSave(slug(ti.value)+'.md','# '+(ti.value||'Untitled')+'\n\n'+ta.value);
    el.querySelector('.pm').onclick=()=>{const order=chapters.length?Math.max(...chapters.map(c=>c.order||0))+1:1,b=ta.value;db.collection(`novels/${novelId}/chapters`).add({title:ti.value||'Untitled chapter',content:b,html:paras(b),order,status:'Draft',by:myId,updatedBy:myId,updatedAt:Date.now()}).then(()=>toast('Added as a new chapter. The page stays here too.')).catch(fail)};
    const sv=()=>{typ();clearTimeout(t);t=setTimeout(()=>ref.update({title:ti.value,body:ta.value,updatedBy:myId,updatedAt:Date.now()}).catch(fail),600)};
    ta.oninput=sv;ti.oninput=sv;
    x.onclick=()=>{if(x.dataset.a){ref.delete().catch(fail)}else{x.dataset.a=1;x.textContent='Sure?';setTimeout(()=>{delete x.dataset.a;x.textContent='Delete'},3000)}};
  });
}
function route(){
  const h=location.hash.slice(1),id=/^[\w-]+$/.test(h)?h:null;
  if(id!==novelId||!built){
    novelId=id;chapId=null;chapters=[];pending=null;dirty=false;built=true;
    if(unsubC){unsubC();unsubC=null}if(unsubN2){unsubN2();unsubN2=null}notes=[];tab='ed';if(unsubCm){unsubCm();unsubCm=null}if(unsubVh){unsubVh();unsubVh=null}if(unsubSt){unsubSt();unsubSt=null}stats=[];vers=[];if(unsubEv){unsubEv();unsubEv=null}evs=[];if(unsubMm){unsubMm();unsubMm=null}if(unsubPm){unsubPm();unsubPm=null}memos=[];pmemos=[];puid=null;pmOk=true;if(unsubPg){unsubPg();unsubPg=null}if(unsubSp){unsubSp();unsubSp=null}pages=[];spaces=[];if(unsubMk){unsubMk();unsubMk=null}mks=[];
    id?buildNovel():buildHome();
    if(id){subC();subNotes();subStats();subEv();subMemos();subSpaces()}setPres();
  }
  refresh();
}
window.addEventListener('hashchange',route);
window.addEventListener('beforeunload',()=>{save()});
db.collection('novels').orderBy('createdAt','desc').onSnapshot(s=>{
  novels=s.docs.map(d=>({id:d.id,...d.data()}));
  resolve(novels.map(n=>n.by));
  if(!built)route();else refresh();
},fail);
route();
})();
</script>
</body>
